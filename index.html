
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automated Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            color: #17365d;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        pre {
            background: #f0f3f6;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>Automated Task Manager</h1>

    <p>GitHub Actions CI/CD Demonstration</p>

    <section>
        <h2>Pending Tasks</h2>
        <pre id="pending">Awaiting workflow...</pre>
    </section>

    <section>
        <h2>Completed Tasks</h2>
        <pre id="completed">Awaiting workflow...</pre>
    </section>

    <section>
        <h2>Unit Test Results</h2>
        <pre id="unittest">Awaiting workflow...</pre>
    </section>
</body>
</html>
