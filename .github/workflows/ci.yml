
name: CI Workflow - Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker Image
        run: docker build -t task-manager:latest .

      - name: Run Task Manager and Unit Tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            task-manager:latest

      - name: Verify Generated HTML
        run: |
          cat index.html
          grep -F "Ran 4 tests" index.html
          grep -F "OK" index.html

      - name: Commit and Push HTML Report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update HTML task and test report"
            git pull --rebase origin main
            git push origin main
          fi
