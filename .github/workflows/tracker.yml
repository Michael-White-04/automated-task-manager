
name: GitHub Projects Automation

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  move-issue-to-done:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Identify Merged Pull Request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Pull request #$PR_NUMBER was merged."
          echo "Checking linked issues."

      - name: Verify Linked Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ISSUES=$(gh pr view "$PR_NUMBER" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number')

          if [ -z "$ISSUES" ]; then
            echo "No linked issues found."
            exit 1
          fi

          for ISSUE in $ISSUES; do
            echo "Checking issue #$ISSUE"

            for ATTEMPT in {1..10}; do
              STATE=$(gh issue view "$ISSUE" \
                --json state --jq '.state')

              if [ "$STATE" = "CLOSED" ]; then
                break
              fi

              sleep 3
            done

            if [ "$STATE" != "CLOSED" ]; then
              echo "Issue #$ISSUE is not closed."
              exit 1
            fi

            echo "Issue #$ISSUE successfully closed."
          done

      - name: Confirm Tracking Workflow
        run: |
          echo "Linked issue closure verified."
          echo "GitHub Projects automation handles the Done status."
